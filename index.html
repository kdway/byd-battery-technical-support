/* ============================================================
   STORAGE SÉCURISÉ
   ============================================================ */
const STORAGE_KEY = 'byd-academy-v2';
const safeStorage = {
  get() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || { scores:{}, completed:{} }; } catch { return { scores:{}, completed:{} }; } },
  set(v) { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(v)); } catch {} }
};
let state = safeStorage.get();

/* ============================================================
   ÉTAT GLOBAL
   ============================================================ */
let lang = (() => { try { return localStorage.getItem('byd-lang') || 'fr'; } catch { return 'fr'; } })();
let currentModuleId = null;
let currentTab = 'content';
let quizState = null;
let darkMode = (() => { try { return localStorage.getItem('byd-dark') === '1'; } catch { return false; } })();

const t = (key) => I18N[lang][key];

/* ============================================================
   RENDU CONTENU
   ============================================================ */
function renderBlock(b) {
  switch (b.type) {
    case 'h2': return `<h3 class="text-xl md:text-2xl font-bold mt-6 mb-3 text-slate-900 dark:text-white">${b.text}</h3>`;
    case 'p': return `<p class="text-slate-600 dark:text-slate-300 leading-relaxed mb-4">${b.text}</p>`;
    case 'list': return `<ul class="space-y-2 mb-4">${b.items.map(it => `<li class="flex gap-3 text-slate-700 dark:text-slate-300"><span class="text-byd mt-1">▸</span><span>${it}</span></li>`).join('')}</ul>`;
    case 'list-numbered': return `<ol class="space-y-2 mb-4">${b.items.map((it,i) => `<li class="flex gap-3 text-slate-700 dark:text-slate-300"><span class="flex-shrink-0 w-6 h-6 rounded-full bg-byd text-white text-xs font-bold flex items-center justify-center">${i+1}</span><span>${it}</span></li>`).join('')}</ol>`;
    case 'warning': return `<div class="bg-amber-50 dark:bg-amber-900/20 border-l-4 border-amber-500 p-4 rounded-r-lg mb-4 text-amber-900 dark:text-amber-200 text-sm">${b.text}</div>`;
    case 'warning-list': return `<div class="bg-rose-50 dark:bg-rose-900/20 border-l-4 border-rose-500 p-4 rounded-r-lg mb-4"><ul class="space-y-1 text-rose-900 dark:text-rose-200 text-sm">${b.items.map(it => `<li>❌ ${it}</li>`).join('')}</ul></div>`;
    case 'cards': return `<div class="grid md:grid-cols-2 gap-4 mb-4">${b.items.map(c => `<div class="p-4 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900"><div class="text-3xl mb-2">${c.icon}</div><div class="font-bold text-slate-900 dark:text-white mb-1">${c.title}</div><div class="text-sm text-slate-600 dark:text-slate-400">${c.desc}</div></div>`).join('')}</div>`;
    case 'checklist': return `<div class="bg-slate-50 dark:bg-slate-900 rounded-xl p-4 mb-4 space-y-2">${b.items.map(it => `<div class="flex items-start gap-3"><span class="text-byd font-bold">✓</span><span class="text-sm text-slate-700 dark:text-slate-300">${it}</span></div>`).join('')}</div>`;
    case 'steps': return `<div class="space-y-2 mb-4">${b.items.map(s => `<div class="flex gap-3 items-start p-3 rounded-lg bg-slate-50 dark:bg-slate-900"><div class="flex-shrink-0 w-8 h-8 rounded-full bg-gradient-to-br from-byd to-emerald-500 text-white font-bold text-sm flex items-center justify-center">${s.n}</div><div><div class="font-semibold text-slate-900 dark:text-white text-sm">${s.t}</div>${s.d ? `<div class="text-xs text-slate-500 dark:text-slate-400">${s.d}</div>` : ''}</div></div>`).join('')}</div>`;
    case 'flow': return `<div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">${b.steps.map(s => `<div class="p-4 rounded-xl bg-gradient-to-br from-slate-100 to-white dark:from-slate-900 dark:to-slate-800 border border-slate-200 dark:border-slate-700 text-center"><div class="text-3xl mb-1">${s.icon}</div><div class="font-bold text-sm text-slate-900 dark:text-white">${s.title}</div><div class="text-xs text-slate-500 dark:text-slate-400 mt-1">${s.desc}</div></div>`).join('')}</div>`;
    case 'table': return `<div class="overflow-x-auto mb-4 rounded-xl border border-slate-200 dark:border-slate-700"><table class="w-full text-sm"><thead class="bg-slate-100 dark:bg-slate-800"><tr>${b.headers.map(h => `<th class="px-4 py-3 text-left font-bold text-slate-900 dark:text-white">${h}</th>`).join('')}</tr></thead><tbody>${b.rows.map(r => `<tr class="border-t border-slate-200 dark:border-slate-700">${r.map(c => `<td class="px-4 py-3 text-slate-700 dark:text-slate-300">${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    case 'decision': return `<div class="space-y-3 mb-4">${b.items.map(d => `<details class="group rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 overflow-hidden"><summary class="cursor-pointer p-4 font-semibold text-slate-900 dark:text-white flex items-center justify-between hover:bg-slate-50 dark:hover:bg-slate-800"><span>🔍 ${d.title}</span><span class="text-byd transition-transform group-open:rotate-180">▼</span></summary><ol class="px-4 pb-4 space-y-2 text-sm text-slate-700 dark:text-slate-300">${d.steps.map((s,j) => `<li class="flex gap-2"><span class="text-byd font-bold">${j+1}.</span><span>${s}</span></li>`).join('')}</ol></details>`).join('')}</div>`;
    case 'ec-table': return `<div class="space-y-3 mb-4">${b.items.map(e => `<details class="group rounded-xl border-2 ${e.severity==='high' ? 'border-rose-300 dark:border-rose-800' : 'border-amber-300 dark:border-amber-800'} bg-white dark:bg-slate-900 overflow-hidden"><summary class="cursor-pointer p-4 flex items-start gap-3 hover:bg-slate-50 dark:hover:bg-slate-800"><span class="flex-shrink-0 px-2.5 py-1 rounded font-mono font-bold text-sm ${e.severity==='high' ? 'bg-rose-100 text-rose-800 dark:bg-rose-900/40 dark:text-rose-300' : 'bg-amber-100 text-amber-800 dark:bg-amber-900/40 dark:text-amber-300'}">EC ${e.code}</span><span class="flex-1 text-sm font-semibold text-slate-900 dark:text-white">${e.sig}</span><span class="text-byd transition-transform group-open:rotate-180">▼</span></summary><div class="px-4 pb-4 pt-2 border-t border-slate-200 dark:border-slate-700"><div class="text-xs font-bold text-byd uppercase mb-1">${t('action_label')}</div><div class="text-sm text-slate-700 dark:text-slate-300">${e.action}</div></div></details>`).join('')}</div>`;
    case 'led-demo': return `<div class="grid md:grid-cols-3 gap-4 mb-4">${b.items.map(d => {
      const whites = Array.from({length:d.white}).map((_,k) => `<span class="w-3 h-3 rounded-full bg-white border-2 border-slate-300 led-blink" style="animation-delay:${k*0.5}s"></span>`).join('');
      const blues = Array.from({length:d.blue}).map((_,k) => `<span class="w-3 h-3 rounded-full bg-blue-500 led-blink" style="animation-delay:${d.white*0.5+k*0.5}s"></span>`).join('');
      return `<div class="p-4 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-center"><div class="flex justify-center gap-2 mb-2 h-6 items-center flex-wrap">${whites}${blues}</div><div class="font-mono font-bold text-byd-dark dark:text-byd">${d.label}</div><div class="text-xs text-slate-500 mt-1">${d.white}W + ${d.blue}B</div></div>`;
    }).join('')}</div>`;
    default: return '';
  }
}

/* ============================================================
   HOME
   ============================================================ */
function renderHome() {
  const total = MODULES.reduce((s,m) => s + m.quiz.length, 0);
  const answered = Object.values(state.scores).reduce((s,v) => s + v.total, 0);
  const correct = Object.values(state.scores).reduce((s,v) => s + v.score, 0);
  const modulesDone = Object.values(state.completed).filter(Boolean).length;
  const pct = Math.round((modulesDone / MODULES.length) * 100);
  const allValidated = modulesDone === MODULES.length;

  const modulesHtml = MODULES.map((m,i) => {
    const done = state.completed[m.id];
    const score = state.scores[m.id];
    return `<button data-action="open" data-id="${m.id}" class="group text-left bg-white dark:bg-slate-900 rounded-2xl p-5 border border-slate-200 dark:border-slate-700 hover:border-byd hover:shadow-xl transition-all">
      <div class="flex items-start gap-4">
        <div class="flex-shrink-0 w-14 h-14 rounded-xl bg-gradient-to-br ${m.color} flex items-center justify-center text-2xl shadow-lg">${m.icon}</div>
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-2 mb-1 flex-wrap">
            <span class="text-xs font-mono text-slate-400">0${i+1}</span>
            ${done ? `<span class="inline-flex px-2 py-0.5 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-800 dark:bg-emerald-900/30 dark:text-emerald-300">${t('validated')}</span>` : ''}
            ${score && !done ? `<span class="inline-flex px-2 py-0.5 rounded-full text-xs font-semibold bg-amber-100 text-amber-800 dark:bg-amber-900/30 dark:text-amber-300">${score.score}/${score.total}</span>` : ''}
          </div>
          <h3 class="font-bold text-slate-900 dark:text-white group-hover:text-byd transition">${m.title[lang]}</h3>
          <p class="text-sm text-slate-500 dark:text-slate-400">${m.subtitle[lang]}</p>
          <p class="text-xs text-slate-400 mt-1">${m.quiz.length} QCM</p>
        </div>
        <div class="text-slate-300 group-hover:text-byd transition text-xl">→</div>
      </div>
    </button>`;
  }).join('');

  return `<div class="fade-in">
    <div class="relative overflow-hidden rounded-3xl p-8 md:p-12 mb-8 bg-gradient-to-br from-slate-900 via-slate-800 to-byd-dark text-white shadow-2xl">
      <div class="absolute -top-20 -right-20 w-64 h-64 rounded-full bg-byd/20 blur-3xl"></div>
      <div class="absolute -bottom-20 -left-20 w-64 h-64 rounded-full bg-emerald-400/20 blur-3xl"></div>
      <div class="relative">
        <div class="flex items-center gap-3 mb-4">
          <div class="w-12 h-12 rounded-xl bg-white/10 backdrop-blur flex items-center justify-center text-2xl">🔋</div>
          <span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-400/20 text-emerald-300">HVS · HVM</span>
        </div>
        <h1 class="text-3xl md:text-5xl font-extrabold leading-tight mb-3">${t('hero_title')}</h1>
        <p class="text-slate-300 max-w-2xl text-sm md:text-base">${t('hero_desc')}</p>
      </div>
    </div>

    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
      ${[
        { label:t('stat_validated'), value:`${modulesDone}/${MODULES.length}`, icon:'✅' },
        { label:t('stat_progress'), value:`${pct}%`, icon:'📊' },
        { label:t('stat_questions'), value:`${answered}/${total}`, icon:'✍️' },
        { label:t('stat_correct'), value:`${correct}`, icon:'🏆' }
      ].map(s => `<div class="bg-white dark:bg-slate-900 p-4 rounded-xl border border-slate-200 dark:border-slate-700"><div class="text-2xl mb-1">${s.icon}</div><div class="text-2xl font-extrabold text-slate-900 dark:text-white">${s.value}</div><div class="text-xs text-slate-500">${s.label}</div></div>`).join('')}
    </div>

    ${allValidated ? `<div class="mb-8 p-6 rounded-2xl bg-gradient-to-r from-amber-400 to-yellow-500 text-amber-900 shadow-lg"><div class="flex items-center gap-3"><div class="text-4xl">🏅</div><div><div class="font-extrabold text-lg">${t('certified')}</div><div class="text-sm">${t('certified_desc')}</div></div></div></div>` : ''}

    <h2 class="text-xl font-bold mb-4 text-slate-900 dark:text-white">${t('modules_title')}</h2>
    <div class="grid md:grid-cols-2 gap-4">${modulesHtml}</div>

    <div class="mt-8 flex justify-end">
      <button data-action="reset" class="text-xs text-slate-400 hover:text-rose-500 transition">${t('reset')}</button>
    </div>

    <div class="mt-6 p-4 rounded-xl bg-slate-100 dark:bg-slate-900 text-xs text-slate-500 dark:text-slate-400">${t('disclaimer')}</div>
  </div>`;
}

   ============================================================ */
function renderModule(m) {
  const score = state.scores[m.id];
  const contentHtml = m.content[lang].map(renderBlock).join('');
  const tabs = `
    <div class="flex gap-2 mb-6 p-1 bg-slate-100 dark:bg-slate-900 rounded-xl w-fit">
      <button data-action="tab" data-tab="content" class="px-4 py-2 rounded-lg text-sm font-semibold transition ${currentTab==='content' ? 'bg-white dark:bg-slate-800 shadow text-byd' : 'text-slate-500'}">${t('tab_course')}</button>
      <button data-action="tab" data-tab="quiz" class="px-4 py-2 rounded-lg text-sm font-semibold transition ${currentTab==='quiz' ? 'bg-white dark:bg-slate-800 shadow text-byd' : 'text-slate-500'}">${t('tab_quiz')} (${m.quiz.length})</button>
    </div>`;

  const body = currentTab === 'content'
    ? `<div class="bg-white dark:bg-slate-900 rounded-2xl p-6 md:p-8 border border-slate-200 dark:border-slate-700">${contentHtml}<div class="mt-8 pt-6 border-t border-slate-200 dark:border-slate-700 flex justify-end"><button data-action="tab" data-tab="quiz" class="px-6 py-2.5 rounded-lg bg-byd text-white font-semibold hover:bg-byd-dark transition">${t('go_quiz')}</button></div></div>`
    : renderQuiz(m, score);

  return `<div class="fade-in">
    <button data-action="home" class="mb-4 text-sm font-semibold text-slate-500 hover:text-byd flex items-center gap-2">${t('back_home')}</button>
    <div class="rounded-2xl p-6 md:p-8 mb-6 bg-gradient-to-br ${m.color} text-white shadow-xl">
      <div class="text-5xl mb-3">${m.icon}</div>
      <h1 class="text-2xl md:text-3xl font-extrabold mb-1">${m.title[lang]}</h1>
      <p class="opacity-90">${m.subtitle[lang]}</p>
    </div>
    ${tabs}
    ${body}
  </div>`;
}

/* ============================================================
   QUIZ
   ============================================================ */
function renderQuiz(m, existing) {
  if (!quizState) quizState = { current:0, answers:[], selected:null, revealed:false, finished:false };
  const qs = quizState;
  const total = m.quiz.length;

  if (qs.finished) {
    const score = qs.answers.filter(a => a.correct).length;
    const pct = Math.round((score/total)*100);
    const pass = pct >= 80;
    return `<div class="fade-in bg-white dark:bg-slate-900 rounded-2xl p-6 md:p-8 border border-slate-200 dark:border-slate-700 shadow-lg text-center">
      <div class="text-6xl mb-4">${pass ? '🏆' : '📚'}</div>
      <h3 class="text-2xl font-bold mb-2">${pass ? t('congrats') : t('almost')}</h3>
      <p class="text-slate-600 dark:text-slate-400 mb-4">${t('score')} : <span class="font-bold text-byd text-xl">${score}/${total}</span> (${pct} %)</p>
      <div class="max-w-xs mx-auto mb-6"><div class="w-full h-2 bg-slate-200 dark:bg-slate-800 rounded-full overflow-hidden"><div class="h-full bg-gradient-to-r from-byd to-emerald-400" style="width:${pct}%"></div></div></div>
      <p class="text-sm text-slate-500 mb-6">${pass ? t('module_ok') : t('need80')}</p>
      <div class="flex flex-wrap gap-3 justify-center">
        <button data-action="restart-quiz" class="px-6 py-2.5 rounded-lg bg-slate-100 dark:bg-slate-800 font-semibold hover:bg-slate-200 dark:hover:bg-slate-700 transition">${t('restart')}</button>
        <button data-action="home" class="px-6 py-2.5 rounded-lg bg-byd text-white font-semibold hover:bg-byd-dark transition">${t('finish')}</button>
      </div>
    </div>`;
  }

  const q = m.quiz[qs.current];
  const options = q.options[lang] || q.options.fr;
  const questionText = q.q[lang] || q.q.fr;
  const explanation = q.expl[lang] || q.expl.fr;

  const opts = options.map((opt,i) => {
    let cls = 'border-slate-200 dark:border-slate-700 hover:border-byd';
    if (qs.revealed) {
      if (i === q.answer) cls = 'border-emerald-500 bg-emerald-50 dark:bg-emerald-900/30';
      else if (i === qs.selected) cls = 'border-rose-500 bg-rose-50 dark:bg-rose-900/30';
      else cls = 'border-slate-200 dark:border-slate-700 opacity-60';
    } else if (qs.selected === i) cls = 'border-byd bg-byd-light dark:bg-byd/20';
    const letter = String.fromCharCode(65+i);
    return `<button data-action="select" data-idx="${i}" ${qs.revealed ? 'disabled' : ''} class="w-full text-left p-4 rounded-xl border-2 transition-all ${cls}">
      <div class="flex items-center gap-3">
        <span class="flex-shrink-0 w-7 h-7 rounded-full border-2 flex items-center justify-center text-xs font-bold ${qs.selected === i ? 'border-byd bg-byd text-white' : 'border-slate-300 dark:border-slate-600'}">${letter}</span>
        <span class="text-sm md:text-base">${opt}</span>
      </div>
    </button>`;
  }).join('');

  const feedback = qs.revealed ? `<div class="p-4 rounded-xl mb-4 text-sm ${qs.selected === q.answer ? 'bg-emerald-50 dark:bg-emerald-900/20 text-emerald-900 dark:text-emerald-200' : 'bg-amber-50 dark:bg-amber-900/20 text-amber-900 dark:text-amber-200'}">
    <div class="font-bold mb-1">${qs.selected === q.answer ? t('good_answer') : `${t('correct_answer')} : ${String.fromCharCode(65+q.answer)}`}</div>
    <div>${explanation}</div>
  </div>` : '';

  return `<div class="fade-in bg-white dark:bg-slate-900 rounded-2xl p-6 md:p-8 border border-slate-200 dark:border-slate-700 shadow-lg">
    <div class="flex items-center justify-between mb-4 flex-wrap gap-2">
      <span class="inline-flex px-2.5 py-0.5 rounded-full text-xs font-semibold bg-byd/10 text-byd-dark dark:bg-byd/20 dark:text-byd">${t('question')} ${qs.current+1} / ${total}</span>
      ${existing ? `<span class="inline-flex px-2.5 py-0.5 rounded-full text-xs font-semibold bg-slate-200 text-slate-700 dark:bg-slate-800 dark:text-slate-300">${t('last_score')} : ${existing.score}/${existing.total}</span>` : ''}
    </div>
    <div class="mb-4"><div class="w-full h-2 bg-slate-200 dark:bg-slate-800 rounded-full overflow-hidden"><div class="h-full bg-gradient-to-r from-byd to-emerald-400 transition-all duration-500" style="width:${(qs.current/total)*100}%"></div></div></div>
    <h3 class="text-lg md:text-xl font-bold mb-6 text-slate-900 dark:text-white">${questionText}</h3>
    <div class="space-y-3 mb-6">${opts}</div>
    ${feedback}
    <div class="flex justify-end gap-3">
      ${!qs.revealed
        ? `<button data-action="validate" ${qs.selected === null ? 'disabled' : ''} class="px-6 py-2.5 rounded-lg bg-byd text-white font-semibold hover:bg-byd-dark disabled:opacity-40 disabled:cursor-not-allowed transition">${t('validate')}</button>`
        : `<button data-action="next" class="px-6 py-2.5 rounded-lg bg-byd text-white font-semibold hover:bg-byd-dark transition">${qs.current+1 < total ? t('next') : t('see_result')}</button>`}
    </div>
  </div>`;
}

/* ============================================================
   ROUTER + NAVBAR
   ============================================================ */
function render() {
  document.documentElement.classList.toggle('dark', darkMode);
  document.documentElement.lang = lang;
  const app = document.getElementById('app');
  const main = currentModuleId ? renderModule(MODULES.find(m => m.id === currentModuleId)) : renderHome();
  const langs = [{code:'fr',label:'FR'},{code:'en',label:'EN'},{code:'de',label:'DE'}];
  const langBtns = langs.map(l => `<button data-action="lang" data-lang="${l.code}" class="px-2.5 py-1 rounded-md text-xs font-bold transition ${lang===l.code ? 'lang-active' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700'}">${l.label}</button>`).join('');

  app.innerHTML = `
    <div class="min-h-screen">
      <header class="sticky top-0 z-40 backdrop-blur-md bg-white/75 dark:bg-slate-900/75 border-b border-slate-200 dark:border-slate-800">
        <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between gap-2">
          <button data-action="home" class="flex items-center gap-2">
            <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-byd to-emerald-600 flex items-center justify-center text-white font-bold text-sm">BYD</div>
            <div class="text-left">
              <div class="font-extrabold text-sm text-slate-900 dark:text-white leading-tight">Battery-Box Academy</div>
              <div class="text-[10px] text-slate-500 dark:text-slate-400 leading-tight">${t('tagline')}</div>
            </div>
          </button>
          <div class="flex items-center gap-2">
            <div class="flex gap-1 p-1 bg-slate-100 dark:bg-slate-800 rounded-lg">${langBtns}</div>
            <button data-action="toggle-dark" class="w-10 h-10 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 flex items-center justify-center transition" aria-label="Theme">${darkMode ? '☀️' : '🌙'}</button>
          </div>
        </div>
      </header>
      <main class="max-w-5xl mx-auto px-4 py-6 md:py-10">${main}</main>
      <footer class="max-w-5xl mx-auto px-4 py-8 text-center text-xs text-slate-400">BYD Battery-Box Academy · ${t('footer')}</footer>
    </div>`;
}

/* ============================================================
   ACTIONS
   ============================================================ */
document.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const action = btn.dataset.action;

  if (action === 'open') {
    currentModuleId = btn.dataset.id; currentTab = 'content'; quizState = null;
    render(); window.scrollTo({ top:0, behavior:'smooth' });
  } else if (action === 'home') {
    currentModuleId = null; quizState = null;
    render(); window.scrollTo({ top:0, behavior:'smooth' });
  } else if (action === 'tab') {
    currentTab = btn.dataset.tab;
    if (currentTab === 'quiz') quizState = null;
    render();
  } else if (action === 'lang') {
    lang = btn.dataset.lang;
    try { localStorage.setItem('byd-lang', lang); } catch {}
    quizState = null;
    render();
  } else if (action === 'toggle-dark') {
    darkMode = !darkMode;
    try { localStorage.setItem('byd-dark', darkMode ? '1' : '0'); } catch {}
    render();
  } else if (action === 'reset') {
    if (confirm(t('reset_confirm'))) {
      state = { scores:{}, completed:{} };
      safeStorage.set(state); render();
    }
  } else if (action === 'select') {
    if (quizState && !quizState.revealed) {
      quizState.selected = parseInt(btn.dataset.idx, 10); render();
    }
  } else if (action === 'validate') {
    if (!quizState || quizState.selected === null) return;
    const m = MODULES.find(x => x.id === currentModuleId);
    const q = m.quiz[quizState.current];
    quizState.revealed = true;
    quizState.answers.push({ selected: quizState.selected, correct: quizState.selected === q.answer });
    render();
  } else if (action === 'next') {
    const m = MODULES.find(x => x.id === currentModuleId);
    const total = m.quiz.length;
    if (quizState.current + 1 < total) {
      quizState.current++; quizState.selected = null; quizState.revealed = false; render();
    } else {
      quizState.finished = true;
      const score = quizState.answers.filter(a => a.correct).length;
      state.scores[m.id] = { score, total };
      state.completed[m.id] = (score/total) >= 0.8;
      safeStorage.set(state); render();
    }
  } else if (action === 'restart-quiz') {
    quizState = null; render();
  }
});

render();
</script>
</body>
</html>
